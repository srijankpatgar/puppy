<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64">
  <defs>
    <filter id="paw-press-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2A1710" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#paw-press-shadow)" transform="scale(0.92) translate(2.5 2.5)">
    <!-- Dark Brown Dog Foot Base Pressed Down -->
    <path
      d="M 32 14 C 18 14 12 26 12 40 C 12 52 20 58 32 58 C 44 58 52 52 52 40 C 52 26 46 14 32 14 Z"
