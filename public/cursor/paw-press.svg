    <ellipse cx="18" cy="26" rx="5.8" ry="7.2" transform="rotate(-22 18 26)" fill="#FFE2BA" stroke="#2A1710" stroke-width="2.4" />
    <ellipse cx="27" cy="18" rx="6.3" ry="7.8" transform="rotate(-8 27 18)" fill="#FFE2BA" stroke="#2A1710" stroke-width="2.4" />
    <ellipse cx="37" cy="18" rx="6.3" ry="7.8" transform="rotate(8 37 18)" fill="#FFE2BA" stroke="#2A1710" stroke-width="2.4" />
    <ellipse cx="46" cy="26" rx="5.8" ry="7.2" transform="rotate(22 46 26)" fill="#FFE2BA" stroke="#2A1710" stroke-width="2.4" />
    <!-- Center Pad Pressed -->
    <path
      d="M 32 32 C 24 32 18 39 18 45 C 18 51 22 53 26 53 C 29 53 30.5 51 32 51 C 33.5 51 35 53 38 53 C 42 53 46 51 46 45 C 46 39 40 32 32 32 Z"
