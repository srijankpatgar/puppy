<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64">
  <defs>
    <filter id="paw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2A1710" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#paw-shadow)">
    <!-- Brown Dog Foot Base -->
    <path
      d="M 32 14 C 18 14 12 26 12 40 C 12 52 20 58 32 58 C 44 58 52 52 52 40 C 52 26 46 14 32 14 Z"
      fill="#8E3F15"
      stroke="#2A1710"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- 4 Skin/Peach Puppy Toe Beans -->
    <!-- Toe 1 -->
    <ellipse cx="18" cy="26" rx="5.5" ry="7" transform="rotate(-22 18 26)" fill="#F8D08C" stroke="#2A1710" stroke-width="2.4" />
    <!-- Toe 2 -->
    <ellipse cx="27" cy="18" rx="6" ry="7.5" transform="rotate(-8 27 18)" fill="#F8D08C" stroke="#2A1710" stroke-width="2.4" />
    <!-- Toe 3 -->
    <ellipse cx="37" cy="18" rx="6" ry="7.5" transform="rotate(8 37 18)" fill="#F8D08C" stroke="#2A1710" stroke-width="2.4" />
    <!-- Toe 4 -->
    <ellipse cx="46" cy="26" rx="5.5" ry="7" transform="rotate(22 46 26)" fill="#F8D08C" stroke="#2A1710" stroke-width="2.4" />
    <!-- Main Center Paw Pad (Heart/Trilobe Skin Tone) -->
    <path
      d="M 32 32 C 24 32 18 39 18 45 C 18 51 22 53 26 53 C 29 53 30.5 51 32 51 C 33.5 51 35 53 38 53 C 42 53 46 51 46 45 C 46 39 40 32 32 32 Z"
      fill="#F8D08C"
      stroke="#2A1710"
      stroke-width="2.6"
      stroke-linejoin="round"
    />
  </g>
</svg>
